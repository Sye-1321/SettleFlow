version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:17'
      timezone: Etc/UTC
    open-pull-requests-limit: 6
    versioning-strategy: increase-if-necessary
    groups:
      prisma-stack:
        applies-to: version-updates
        patterns:
          - prisma
          - '@prisma/*'
        update-types:
          - minor
          - patch
      prisma-security:
        applies-to: security-updates
        patterns:
          - prisma
          - '@prisma/*'
          - effect
      compatible-development-tooling:
        applies-to: version-updates
        dependency-type: development
        exclude-patterns:
          - prisma
          - '@prisma/*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:31'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      compatible-actions:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:43'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
