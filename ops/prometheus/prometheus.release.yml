global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: settleflow-api
    static_configs:
      - targets: ['api:9464']

  - job_name: settleflow-worker
    static_configs:
      - targets: ['worker:9465']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
