name: settleflow

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-settleflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-settleflow_local_only}
      POSTGRES_USER: ${POSTGRES_USER:-settleflow}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-settleflow_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-settleflow_app_local_only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./tools/database:/opt/settleflow/database:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.4-management@sha256:4e628d3cbc61ef45c5918e19bb9844874410d96d4ced897ced7d072d63ad555c
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-settleflow_local_only}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-settleflow}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-settleflow}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  otel-collector:
    profiles: ['telemetry']
    image: otel/opentelemetry-collector-contrib:0.158.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
    volumes:
      - ./ops/otel-collector/config.yml:/etc/otelcol-contrib/config.yaml:ro
    stop_grace_period: 10s

  prometheus:
    profiles: ['telemetry']
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - ./ops/prometheus/tests:/etc/prometheus/tests:ro
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector
    stop_grace_period: 10s

volumes:
  postgres_data:
  prometheus_data:
  rabbitmq_data:
