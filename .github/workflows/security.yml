name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: development,runtime,unknown
          show-openssf-scorecard: true
          warn-only: false

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  supply-chain:
    name: Secrets, dependencies, licenses, and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the locked workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm install --frozen-lockfile
      - name: Enforce repository security policy
        run: pnpm security:policy
      - name: Scan repository history and working tree for secrets
        run: pnpm security:secrets

  images:
    name: Build, inspect, scan, and inventory OCI images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Enable the attestation-capable containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: version=28.0.4
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the locked workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm install --frozen-lockfile
      - name: Generate ignored synthetic release configuration
        run: |
          pnpm release:config:create
          pnpm release:compose:check
      - name: Build and validate the three release-simulation images
        id: image-build
        run: |
          pnpm clean
          pnpm images:build
          pnpm images:validate
          pnpm security:dockerfile
      - name: Scan image packages and filesystem secrets
        id: image-scan
        run: pnpm images:scan
      - name: Generate SPDX SBOM and bounded release evidence
        if: always() && steps.image-build.outcome == 'success'
        run: |
          pnpm images:sbom
          pnpm release:evidence
      - name: Retain non-secret release evidence
        if: always() && steps.image-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .settleflow/ci-evidence/*.spdx.json
            .settleflow/ci-evidence/image-security-summary.json
            .settleflow/ci-evidence/release-evidence.json
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Attest main-branch evidence without publishing images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: evidence/*.json
          show-summary: true
