x-app-security: &app-security
  cap_drop: [ALL]
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1777
  user: '10001:10001'

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/postgres.env']
    networks: [backend]
    volumes:
      - recovery_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0

  rabbitmq:
    image: rabbitmq:4.3.4-management@sha256:4e628d3cbc61ef45c5918e19bb9844874410d96d4ced897ced7d072d63ad555c
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/rabbitmq.env']
    networks: [backend]
    volumes:
      - recovery_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0

  role-provisioner:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    env_file:
      ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/role-provisioner.env']
    entrypoint: [psql]
    command: [--file, /opt/settleflow/database/provision-runtime-role.sql]
    volumes:
      - ./tools/database/provision-runtime-role.sql:/opt/settleflow/database/provision-runtime-role.sql:ro
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  restorer:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/restore.env']
    entrypoint: [pg_restore]
    command:
      - --dbname=settleflow
      - --exit-on-error
      - --no-owner
      - --no-acl
      - --single-transaction
      - /backup/database.dump
    volumes:
      - type: bind
        source: ${SETTLEFLOW_RECOVERY_DUMP_PATH:?validated backup path required}
        target: /backup/database.dump
        read_only: true
    networks: [backend]
    depends_on:
      role-provisioner: { condition: service_completed_successfully }
    restart: 'no'

  grant-provisioner:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    env_file:
      ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/role-provisioner.env']
    entrypoint: [psql]
    command: [--file, /opt/settleflow/database/provision-runtime-grants.sql]
    volumes:
      - ./tools/database/provision-runtime-grants.sql:/opt/settleflow/database/provision-runtime-grants.sql:ro
    networks: [backend]
    depends_on:
      restorer: { condition: service_completed_successfully }
    restart: 'no'

  migrator:
    image: settleflow-migrator:${SETTLEFLOW_RECOVERY_IMAGE_VERSION:?application image version required}
    <<: *app-security
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/migrator.env']
    networks: [backend]
    depends_on:
      grant-provisioner: { condition: service_completed_successfully }
    restart: 'no'
    mem_limit: 384m
    cpus: 1.0

  recovery-verifier:
    image: settleflow-migrator:${SETTLEFLOW_RECOVERY_IMAGE_VERSION:?application image version required}
    <<: *app-security
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/verifier.env']
    command: [tools/operations/verify-restored-database.mjs]
    volumes:
      - ./tools/operations/verify-restored-database.mjs:/app/tools/operations/verify-restored-database.mjs:ro
    networks: [backend]
    depends_on:
      migrator: { condition: service_completed_successfully }
    restart: 'no'
    mem_limit: 384m
    cpus: 1.0

  api:
    image: settleflow-api:${SETTLEFLOW_RECOVERY_IMAGE_VERSION:?application image version required}
    <<: *app-security
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/api.env']
    networks: [backend, api-ingress]
    ports:
      - target: 3000
        published: ${SETTLEFLOW_RECOVERY_API_PORT:-14000}
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    depends_on:
      recovery-verifier: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 1.0

  worker:
    image: settleflow-worker:${SETTLEFLOW_RECOVERY_IMAGE_VERSION:?application image version required}
    <<: *app-security
    env_file: ['${SETTLEFLOW_RECOVERY_CONFIG_DIR:?recovery configuration required}/worker.env']
    networks: [backend, worker-egress]
    depends_on:
      recovery-verifier: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 1.0

networks:
  backend:
    internal: true
  api-ingress: {}
  worker-egress: {}

volumes:
  recovery_postgres_data:
  recovery_rabbitmq_data:
